services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deerstand
      POSTGRES_PASSWORD: deerstand_dev
      POSTGRES_DB: deerstand
    ports:
      - "5433:5432"
    volumes:
      - deerstand_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deerstand -d deerstand"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deerstand_pg_data:
